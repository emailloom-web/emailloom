<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-label="Preview of the EmailLoom website homepage">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31e6e2"/>
      <stop offset="1" stop-color="#1ab7b3"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101415"/>
      <stop offset="1" stop-color="#14181a"/>
    </linearGradient>
  </defs>

  <!-- page background -->
  <rect width="800" height="550" fill="#f5faf7"/>

  <!-- browser chrome -->
  <rect width="800" height="42" fill="#181e20"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="21" r="6" fill="#febc2e"/>
  <circle cx="64" cy="21" r="6" fill="#28c840"/>
  <rect x="90" y="10" width="380" height="22" rx="11" fill="rgba(255,255,255,.07)"/>
  <text x="106" y="26" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7d938a">emailloom.com</text>

  <!-- dark hero -->
  <rect x="0" y="42" width="800" height="300" fill="url(#dark)"/>

  <!-- floating logo squares -->
  <g fill="none" stroke="#31e6e2" stroke-width="3" opacity=".25">
    <rect x="640" y="80" width="30" height="30" rx="5"/>
    <rect x="712" y="180" width="20" height="20" rx="4"/>
    <rect x="580" y="250" width="24" height="24" rx="4"/>
  </g>

  <!-- nav row -->
  <rect x="40" y="66" width="34" height="34" rx="8" fill="none" stroke="#31e6e2" stroke-width="3.5"/>
  <rect x="48" y="88" width="18" height="4" rx="2" fill="#31e6e2"/>
  <text x="86" y="90" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="22" fill="#ffffff">Email<tspan font-weight="400">Loom</tspan></text>
  <g fill="rgba(255,255,255,.45)">
    <rect x="420" y="78" width="46" height="8" rx="4"/>
    <rect x="480" y="78" width="46" height="8" rx="4"/>
    <rect x="540" y="78" width="46" height="8" rx="4"/>
  </g>
  <rect x="620" y="66" width="140" height="34" rx="17" fill="url(#teal)"/>

  <!-- headline -->
  <text x="40" y="176" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#ffffff">Emails that land.</text>
  <text x="40" y="226" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="url(#teal)">Everywhere.</text>

  <!-- copy lines -->
  <g fill="rgba(196,210,203,.55)">
    <rect x="40" y="252" width="320" height="9" rx="4.5"/>
    <rect x="40" y="270" width="260" height="9" rx="4.5"/>
  </g>

  <!-- CTAs -->
  <rect x="40" y="296" width="150" height="34" rx="17" fill="url(#teal)"/>
  <rect x="204" y="296" width="150" height="34" rx="17" fill="none" stroke="#31e6e2" stroke-width="2"/>

  <!-- hero visual: phone + email blocks -->
  <g transform="translate(560,120)">
    <rect x="0" y="0" width="150" height="196" rx="18" fill="#12171a" stroke="#2b3234" stroke-width="5"/>
    <rect x="52" y="12" width="46" height="6" rx="3" fill="#2b3234"/>
    <rect x="16" y="30" width="118" height="52" rx="8" fill="url(#teal)"/>
    <rect x="16" y="94" width="118" height="9" rx="4.5" fill="rgba(255,255,255,.2)"/>
    <rect x="16" y="112" width="92" height="9" rx="4.5" fill="rgba(255,255,255,.2)"/>
    <rect x="16" y="134" width="80" height="22" rx="11" fill="url(#teal)"/>
  </g>

  <!-- light section below hero -->
  <g>
    <rect x="290" y="368" width="220" height="14" rx="7" fill="#101b16"/>
    <rect x="330" y="392" width="140" height="8" rx="4" fill="#9aa8a1"/>
  </g>

  <!-- three feature cards -->
  <g>
    <rect x="40" y="420" width="225" height="106" rx="16" fill="#ffffff" stroke="#e3ece7"/>
    <rect x="62" y="440" width="34" height="34" rx="10" fill="#e6fbfa"/>
    <rect x="62" y="486" width="130" height="9" rx="4.5" fill="#101b16"/>
    <rect x="62" y="503" width="170" height="7" rx="3.5" fill="#c3d0c9"/>

    <rect x="288" y="420" width="225" height="106" rx="16" fill="#ffffff" stroke="#e3ece7"/>
    <rect x="310" y="440" width="34" height="34" rx="10" fill="#e6fbfa"/>
    <rect x="310" y="486" width="130" height="9" rx="4.5" fill="#101b16"/>
    <rect x="310" y="503" width="170" height="7" rx="3.5" fill="#c3d0c9"/>

    <rect x="536" y="420" width="225" height="106" rx="16" fill="#ffffff" stroke="#e3ece7"/>
    <rect x="558" y="440" width="34" height="34" rx="10" fill="#e6fbfa"/>
    <rect x="558" y="486" width="130" height="9" rx="4.5" fill="#101b16"/>
    <rect x="558" y="503" width="170" height="7" rx="3.5" fill="#c3d0c9"/>
  </g>
</svg>
